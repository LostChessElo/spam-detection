name: CI

on:
  push:
    branches-ignore:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        command:
          - pytest
          - "ruff check ."
          - "mypy src/"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.14

      - run: uv sync --extra dev

      - run: uv run ${{ matrix.command }}